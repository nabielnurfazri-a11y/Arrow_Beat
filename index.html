/* ===== Library (IndexedDB) ===== */
var db=null,mem=[],useMem=false,memId=1;
function dbOpen(){return new Promise(function(res){if(db||useMem)return res();try{var r=indexedDB.open('abeat',1);r.onupgradeneeded=function(){r.result.createObjectStore('songs',{keyPath:'id',autoIncrement:true});};r.onsuccess=function(){db=r.result;try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}res();};r.onerror=function(){useMem=true;res();};}catch(e){useMem=true;res();}});}
function dbTx(mode,fn){return new Promise(function(res,rej){var tx=db.transaction('songs',mode),rq=fn(tx.objectStore('songs'));tx.oncomplete=function(){res(rq&&rq.result);};tx.onerror=tx.onabort=function(){rej(tx.error||new Error('Transaksi gagal'));};});}
function dbAll(){return dbOpen().then(function(){return useMem?mem.slice():dbTx('readonly',function(s){return s.getAll();});});}
function dbPut(r){return dbOpen().then(function(){if(useMem){if(!r.id)r.id=memId++;var ix=mem.findIndex(function(x){return x.id===r.id;});if(ix<0)mem.push(r);else mem[ix]=r;return r.id;}return dbTx('readwrite',function(s){return s.put(r);});});}
function dbDel(id){return dbOpen().then(function(){if(useMem){mem=mem.filter(function(x){return x.id!==id;});return;}return dbTx('readwrite',function(s){return s.delete(id);});});}

function gv(c,k){return k.indexOf('w.')===0?c.w[k.slice(2)]:c[k];}
function sv(c,k,v){if(k.indexOf('w.')===0)c.w[k.slice(2)]=v;else c[k]=v;}
function sl(lb,k,mn,mx,sp){var v=gv(E.cfg,k);return '<label class="sl"><span>'+lb+'</span><b id="v_'+k+'">'+v+'</b><input type="range" data-k="'+k+'" min="'+mn+'" max="'+mx+'" step="'+sp+'" value="'+v+'"></label>';}
